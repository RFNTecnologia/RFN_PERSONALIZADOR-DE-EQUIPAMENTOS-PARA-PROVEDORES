services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 15s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  genieacs:
    build:
      context: ./genieacs
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/genieacs?authSource=admin
      GENIEACS_REDIS_HOST: redis
      GENIEACS_REDIS_PORT: 6379
      GENIEACS_REDIS_PASSWORD: ${REDIS_PASSWORD}
      GENIEACS_UI_JWT_SECRET: ${GENIEACS_UI_JWT_SECRET}
      GENIEACS_EXT_DIR: /opt/genieacs/ext
      GENIEACS_CWMP_INTERFACE: 0.0.0.0
      GENIEACS_CWMP_PORT: 7547
      GENIEACS_NBI_INTERFACE: 0.0.0.0
      GENIEACS_NBI_PORT: 7557
      GENIEACS_FS_INTERFACE: 0.0.0.0
      GENIEACS_FS_PORT: 7567
      GENIEACS_UI_INTERFACE: 0.0.0.0
      GENIEACS_UI_PORT: 3000
    volumes:
      - ./genieacs/ext:/opt/genieacs/ext
      - ./genieacs/config:/opt/genieacs/config
      - genieacs_logs:/var/log/genieacs
    ports:
      - "7547:7547"
    expose:
      - "7557"
      - "7567"
      - "3000"
    networks: [backend, edge]

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GENIEACS_NBI_URL: http://genieacs:7557
    expose:
      - "8080"
    networks: [backend, edge]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api, genieacs]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs
      - ./frontend:/usr/share/nginx/html:ro
    networks: [edge]

networks:
  backend:
    internal: true
  edge:

volumes:
  mongo_data:
  mongo_config:
  redis_data:
  postgres_data:
  genieacs_logs:
  nginx_certs: